<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>啾啾雀控制</title>
<style>
body{background:#1a1a2e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{color:#e91e8c;margin-bottom:20px}
button{margin:6px;padding:15px 30px;border:none;border-radius:25px;font-size:16px;cursor:pointer}
#connect{background:#e91e8c;color:#fff}
#stop{background:#444;color:#fff}
h2{color:#bbb;font-size:14px;margin:18px 0 6px;width:min(560px,92vw);text-align:left}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(560px,92vw);margin:0 0 6px}
.grid button{padding:8px 0;font-size:12px;border:none;border-radius:6px;cursor:pointer;width:100%}
.suck{background:#8e44ad;color:#fff}
.suck.active{background:#d2a4f0;color:#1a1a2e;box-shadow:0 0 10px #a04fd4}
.vib{background:#2980b9;color:#fff}
.vib.active{background:#a8d8f0;color:#1a1a2e;box-shadow:0 0 10px #5dade2}
#status{margin-top:20px;color:#aaa;font-size:14px}
#relaystatus{color:#aaa;font-size:13px}
#lastcmd{color:#666;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>🐦 啾啾雀</h1>
<button id="connect" onclick="connect()">连接蓝牙</button>
<h2>吮吸（模式1-8 × 强度1-10）</h2>
<div class="grid" id="suckGrid"></div>
<h2>振动（模式1-8 × 强度1-10）</h2>
<div class="grid" id="vibGrid"></div>
<button id="stop" onclick="stopAll()">⏹ 全部停止</button>
<p id="status">未连接</p>
<p id="relaystatus">轮询：未开始</p>
<p id="lastcmd"></p>

<script>
let char;
let lastCmd = null;

const STOP_SUCK = [0x55,0x09,0x00,0x00,0x00,0x00,0x00];
const STOP_VIB = [0x55,0x03,0x00,0x00,0x00,0x00,0x00];
const RELAY = 'https://little-cake-9203.rankiejesse.workers.dev/';

function buildCmd(func, mode, level){
 return [0x55, func, 0x00, 0x00, mode & 0xff, level & 0xff, 0x00];
}

function buildGrid(id, func){
 const c = document.getElementById(id);
 for(let mode = 1; mode <= 8; mode++){
 for(let level = 1; level <= 10; level++){
 const b = document.createElement('button');
 b.className = func === 9 ? 'suck' : 'vib';
 b.textContent = mode + '-' + level;
 b.onclick = () => switchTo(func, mode, level, b);
 c.appendChild(b);
 }
 }
}
buildGrid('suckGrid', 9);
buildGrid('vibGrid', 3);

async function connect(){
 try{
 document.getElementById('status').innerText='连接中...';
 const dev = await navigator.bluetooth.requestDevice({
 filters:[{name:'HS141B'}],
 optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb']
 });
 const srv = await (await dev.gatt.connect()).getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
 char = await srv.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
 document.getElementById('status').innerText = '✅ 已连接：' + dev.name;
 startPolling();
 } catch(e) {
 document.getElementById('status').innerText = '❌ ' + e;
 }
}

function startPolling(){
 document.getElementById('relaystatus').innerText = '轮询：运行中';
 setInterval(async () => {
 try{
 const r = await fetch(RELAY);
 const cmd = await r.json();
 if(cmd && Array.isArray(cmd)){
 await sendBytes(cmd);
 if(cmd.length >= 6 && cmd[5] === 0x00){
 lastCmd = null;
 } else {
 lastCmd = cmd.slice();
 }
 showLast(cmd);
 }
 } catch(e){}
 }, 1000);
}

function showLast(bytes){
 document.getElementById('lastcmd').innerText = '最近指令: ' + bytes.map(b=>'0x'+b.toString(16).padStart(2,'0')).join(' ');
}

async function sendBytes(bytes){
 if(!char) return;
 try{ await char.writeValue(new Uint8Array(bytes)); }
 catch(e){ document.getElementById('status').innerText = '发送失败：' + e; }
}

async function send(bytes){
 if(!char){ alert('请先连接蓝牙'); return; }
 await sendBytes(bytes);
}

async function switchTo(func, mode, level, btn){
 const bytes = buildCmd(func, mode, level);
 await send(bytes);
 lastCmd = bytes.slice();
 document.querySelectorAll('.suck,.vib').forEach(b => b.classList.remove('active'));
 if(btn) btn.classList.add('active');
 showLast(bytes);
}

async function stopAll(){
 document.querySelectorAll('.suck,.vib').forEach(b => b.classList.remove('active'));
 lastCmd = null;
 await send(STOP_SUCK);
 await send(STOP_VIB);
 document.getElementById('lastcmd').innerText = '已停止';
}

setInterval(() => {
 if(lastCmd && char) char.writeValue(new Uint8Array(lastCmd)).catch(()=>{});
}, 1200);
</script>
</body>
</html>
